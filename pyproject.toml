[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-apigw-config-audit"
version = "0.3.0"
description = "Offline API Gateway deployment configuration auditor (synthetic data, portfolio project)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
apigw-audit = "apigw_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
